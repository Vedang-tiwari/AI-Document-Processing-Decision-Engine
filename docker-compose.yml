services:
  postgres:
    image: postgres:16-alpine
    container_name: doc_engine_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: documents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d documents"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doc_engine_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_engine_api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/documents
      REDIS_URL: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "false"
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
      PYTHONPATH: /app/backend:/app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./configs:/app/configs
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_engine_worker
    command: celery -A backend.app.tasks.celery_app worker --loglevel=info -c 2
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/documents
      REDIS_URL: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "false"
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
      PYTHONPATH: /app/backend:/app
    volumes:
      - ./backend:/app/backend
      - ./configs:/app/configs
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc_engine_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
